{% extends "base.html" %} {% block title %}Add Product{% endblock %} {% block
content %}
<h2>Add Product</h2>

<form class="wide-box" method="post" action="{{ url_for('add_product') }}">
  <div class="columns">
    <div>
      <h4>Product Name</h4>
      <input
        type="text"
        name="prname"
        value="{{ form.prname or '' }}"
        required
      />
      <h4>Product ID</h4>
      <input type="text" name="prid" value="{{ form.prid or '' }}" required />
      <h4>Manufacturer Name</h4>
      <input
        type="text"
        name="mfname"
        value="{{ form.mfname or '' }}"
        required
      />
      <h4>Manufacture Date</h4>
      <input type="date" name="mdate" value="{{ form.mdate or '' }}" required />
      <h4>Expiry Date</h4>
      <input type="date" name="edate" value="{{ form.edate or '' }}" required />
    </div>
    <div>
      <h4>Quantity</h4>
      <input
        type="text"
        name="quantity"
        data-numeric
        value="{{ form.quantity or '' }}"
        required
      />
      <h4>Price</h4>
      <input
        type="text"
        name="price"
        data-numeric
        value="{{ form.price or '' }}"
        required
      />
      <p><input type="submit" value="Add" /></p>
    </div>
  </div>
</form>
{% endblock %}
